                const colorClass = gorbovState.color === 'black'
                    ? 'text-slate-800 dark:text-slate-100'
                    : 'text-rose-600 dark:text-rose-400';
                const targetNum = gorbovState.color === 'black' ? gorbovState.blackNumber : gorbovState.redNumber;
                return (
                    <span>Знайдіть: <span className={`font-bold ${colorClass}`}>{colorText} {targetNum}</span></span>
                );
            };

            const getDynamicFontSize = () => {
                if (gridSize > 7) return '0.9rem';
                if (gridSize > 5) return '1.4rem';
                return '2rem';
            };

            const totalCells = gridSize * gridSize;

            // --- Renders ---

            // 1. Menu Screen
            if (gameState === 'menu') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden transition-colors duration-300 bg-[#F5F5F7] dark:bg-slate-950">
                        <div className="absolute top-[-10%] right-[-10%] w-96 h-96 bg-blue-200 dark:bg-blue-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-30 dark:opacity-20 transition-colors duration-500"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-purple-200 dark:bg-purple-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-30 dark:opacity-20 transition-colors duration-500"></div>

                        <div className="w-full max-w-md bg-white/70 dark:bg-slate-800/70 backdrop-blur-xl rounded-3xl shadow-xl border border-white/50 dark:border-slate-700 p-8 z-10 animate-pop transition-all duration-300">

                            {/* Theme Toggle */}
                            <div className="absolute top-6 right-6">
                                <button
                                    onClick={toggleTheme}
                                    className="p-2 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 transition-colors"
                                >
                                    {isDark ? <SunIcon /> : <MoonIcon />}
                                </button>
                            </div>

                            <div className="flex flex-col items-center mb-6">
                                <div className="w-16 h-16 bg-slate-900 dark:bg-slate-700 rounded-2xl flex items-center justify-center mb-4 shadow-lg text-white transition-colors">
                                    <span className="font-bold text-3xl">S</span>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white transition-colors">Schulte Focus Pro</h1>
                                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1 transition-colors">Тренуйте зір та увагу</p>
                                {history.length > 0 && (
                                    streakInfo.current > 0 ? (
                                        <p className="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-orange-50 text-orange-700 dark:bg-orange-900/30 dark:text-orange-300">
                                            <i className="ph ph-fire text-sm"></i>
                                            {streakInfo.current} {pluralUk(streakInfo.current, DAYS_WORDS)} поспіль
                                            {streakInfo.today > 0 && ` · сьогодні ${streakInfo.today} ${pluralUk(streakInfo.today, GAMES_WORDS)}`}
                                        </p>
                                    ) : (
                                        <p className="mt-3 inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1 rounded-full bg-slate-100 text-slate-500 dark:bg-slate-700/60 dark:text-slate-400">
                                            <i className="ph ph-calendar-check text-sm"></i>
                                            Сьогодні ще без тренування
                                        </p>
                                    )
                                )}
                            </div>

                            <div className="space-y-5">
                                <div>
                                    <label className="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 block">Розмір сітки: {gridSize}×{gridSize}</label>
                                    <div className="flex bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl transition-colors overflow-x-auto no-scrollbar gap-1">
                                        {[3, 4, 5, 6, 7, 8, 9, 10].map(size => (
                                            <button
                                                key={size}
                                                onClick={() => setGridSize(size)}
                                                className={`min-w-[40px] flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 whitespace-nowrap ${
                                                    gridSize === size
                                                        ? 'bg-white dark:bg-slate-600 text-slate-900 dark:text-white shadow-sm'
                                                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                                                }`}
                                            >
                                                {size}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 block">Налаштування</label>
                                    <Toggle
                                        label="Режим Горбова"
                                        checked={isGorbov}
                                        onChange={(val) => { setIsGorbov(val); if (val) setIsColorful(false); }}
                                    />
                                    {isGorbov && (
                                        <div className="border-t border-slate-100 dark:border-slate-700 mt-1 pt-1 transition-colors">
                                            <Toggle label="Справжній Горбов (Складно)" checked={isTrueGorbov} onChange={setIsTrueGorbov} />
                                        </div>
                                    )}
                                    {!isGorbov && (
                                        <div className="border-t border-slate-100 dark:border-slate-700 mt-1 pt-1 transition-colors">
                                            <Toggle label="Кольорові числа" checked={isColorful} onChange={setIsColorful} />
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-3 pt-2">
                                    <button
                                        onClick={() => setGameState('stats')}
                                        className="w-1/4 py-4 bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 rounded-2xl font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center"
                                        title="Статистика"
                                        aria-label="Статистика"
                                    >
                                        <ChartIcon />
                                    </button>
                                    <button
                                        onClick={startGame}
                                        className="flex-1 py-4 bg-slate-900 dark:bg-blue-600 text-white rounded-2xl font-semibold text-lg hover:bg-slate-800 dark:hover:bg-blue-500 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-900/20 dark:shadow-blue-900/20"
                                    >
                                        <PlayIcon /> Почати
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. Statistics Screen
            if (gameState === 'stats') {
                return (
                    <StatsScreen
                        history={history}
                        initialMode={getCurrentModeKey()}
                        initialSize={gridSize}
                        onBack={() => setGameState('menu')}
                        onImport={importHistory}
                        onClear={clearHistory}
                    />
                );
            }

            // 3. Won Screen
            if (gameState === 'won') {
                const contextMode    = getCurrentModeKey();
                const contextRecords = history.filter(r => r.mode === contextMode && r.gridSize === gridSize);
                // Records only count games timed from the grid's appearance
                const freshTimes = contextRecords.filter(r => !isLegacy(r)).map(r => r.time);
                const best = freshTimes.length > 0 ? Math.min(...freshTimes) : null;
                const isNewRecord = best !== null && elapsed <= best;

                const norm = getNorm(contextRecords, dayKey(new Date())).value;
                const normPct = norm !== null ? deviationPct(elapsed, norm) : null;
                const lapses = lastResult ? countLapses(lastResult.splits) : null;
                const stepLabel = contextMode.startsWith('gorbov') ? (i) => `крок ${i + 1}` : (i) => `число ${i + 1}`;

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 relative bg-[#F5F5F7] dark:bg-slate-950 transition-colors duration-300">
                        <div className="w-full max-w-sm bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 text-center animate-pop border border-white/50 dark:border-slate-700 transition-colors">

                            {/* ✅ IMPROVED: show trophy if new record */}
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 transition-colors ${
                                isNewRecord
                                    ? 'bg-amber-100 dark:bg-amber-900/30 text-amber-500'
                                    : 'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400'
                            }`}>
                                {isNewRecord ? <TrophyIcon /> : <CheckIcon />}
                            </div>

                            <h2 className="text-3xl font-bold text-slate-900 dark:text-white mb-2 transition-colors">
                                {isNewRecord ? '🏆 Новий рекорд!' : 'Чудово!'}
                            </h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-5 transition-colors">Результат збережено в статистику.</p>

                            <div className="bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-5 mb-3 border border-slate-100 dark:border-slate-700 transition-colors">
                                <p className="text-sm text-slate-400 dark:text-slate-500 uppercase tracking-wide font-semibold mb-1">Час</p>
                                <p className="text-4xl font-mono font-medium text-slate-900 dark:text-white transition-colors">{formatTime(elapsed)}</p>
                                {best && !isNewRecord && (
                                    <p className="text-xs text-slate-400 mt-2">Рекорд: {formatTime(best)}</p>
                                )}
                                {normPct !== null && (
                                    <div className="mt-3">
                                        <StateChip pct={normPct} text={`${formatPct(normPct)} від вашої норми`} />
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-2 gap-2 mb-3 text-left">
                                <Tile label="Помилки" value={lastResult ? lastResult.errors : '—'} sub="хибних натискань" />
                                <Tile label="Зависання" value={lapses ?? '—'} sub="удвічі довше за темп" />
                            </div>

                            {lastResult && Array.isArray(lastResult.splits) && lastResult.splits.length > 1 && (
                                <div className="bg-slate-50 dark:bg-slate-900/50 rounded-2xl px-4 pt-3 pb-3 mb-5 border border-slate-100 dark:border-slate-700 text-left transition-colors">
                                    <p className="text-[10px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">Темп по кроках</p>
                                    <SplitsChart splits={lastResult.splits} stepLabel={stepLabel} />
                                </div>
                            )}

                            <button
                                onClick={() => setGameState('menu')}
                                className="w-full py-3 mb-3 bg-transparent border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-700/50 hover:text-slate-700 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-2"
                            >
                                <CaretLeftIcon /> Головне меню
                            </button>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setGameState('stats')}
                                    className="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                                >
                                    Статистика
                                </button>
                                <button
                                    onClick={startGame}
                                    className="flex-1 py-3 bg-slate-900 dark:bg-blue-600 text-white rounded-xl font-medium hover:bg-slate-800 dark:hover:bg-blue-500 shadow-lg shadow-slate-900/20 dark:shadow-blue-900/20 transition-all active:scale-95"
                                >
                                    Ще раз
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 4. Game Board (playing)
            return (
                <div className="min-h-screen flex flex-col items-center bg-[#F5F5F7] dark:bg-slate-950 text-slate-900 dark:text-white relative transition-colors duration-300">

                    <header className="w-full max-w-2xl px-6 py-6 flex items-center justify-between">
                        {/* ✅ CHANGED: icon button instead of text "Меню" */}
                        <button
                            onClick={() => setGameState('menu')}
                            className="p-2 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-all"
                            title="Меню"
                        >
                            <CaretLeftIcon />
                        </button>

                        <div className="font-mono text-xl font-medium bg-white dark:bg-slate-800 px-4 py-1 rounded-full shadow-sm border border-slate-100 dark:border-slate-700 text-slate-700 dark:text-slate-200 tabular-nums transition-colors">
                            {formatTime(elapsed)}
                        </div>

                        <button
                            onClick={startGame}
                            className="p-2 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-all"
                            title="Перезапустити"
                        >
                            <RestartIcon />
                        </button>
                    </header>

                    <div className="mb-3 px-6 py-2 backdrop-blur-md rounded-full shadow-sm border text-lg font-medium transition-colors bg-white/60 dark:bg-slate-800/60 border-white/50 dark:border-slate-700 text-slate-600 dark:text-slate-300">
                        {getInstructionText()}
                    </div>

                    <ProgressBar current={nextTarget} total={totalCells} />

                    <div className="flex-1 flex items-center justify-center w-full px-4 pb-12">
                        <div
                            className="bg-white dark:bg-slate-900 p-3 rounded-3xl shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-100 dark:border-slate-800 relative transition-colors duration-300"
                            style={{
                                display: 'grid',
                                gridTemplateColumns: `repeat(${gridSize}, 1fr)`,
                                gap: gridSize > 8 ? '6px' : '10px',
                                width: '100%',
                                maxWidth: '600px',
                                aspectRatio: '1/1',
                            }}
                        >
                            {/* Central focus dot */}
                            <div className="absolute top-1/2 left-1/2 w-2 h-2 bg-blue-400/20 rounded-full transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-0"></div>

                            {cells.map((cell) => {
                                const isFound   = foundIds.has(cell.id);
                                const isSuccess = successId === cell.id;
                                const isShaking = shakeId  === cell.id;

                                return (
                                    <button
                                        key={cell.id}
                                        onClick={() => handleCellClick(cell)}
                                        disabled={isFound}
                                        className={`
                                            relative z-10
                                            flex items-center justify-center
                                            rounded-xl sm:rounded-2xl
                                            font-semibold
                                            select-none outline-none
                                            cell-shadow
                                            ${isFound
                                                ? `cell-found bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 ${cell.color}`
                                                : `bg-slate-50 dark:bg-slate-800 hover:bg-white dark:hover:bg-slate-700 border border-slate-100 dark:border-slate-700 ${cell.color}`
                                            }
                                            ${isSuccess ? (isDark ? 'animate-success-dark' : 'animate-success-light') : ''}
                                            ${isShaking ? 'animate-shake bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800' : ''}
                                        `}
                                        style={{ fontSize: getDynamicFontSize() }}
                                    >
                                        {cell.value}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="pb-6 text-slate-400 dark:text-slate-600 text-xs font-medium uppercase tracking-widest opacity-60 transition-colors">
                        Фокусуйте погляд у центрі
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
